    <!-- Core Session Manager -->
    <script>
        (function () {
            function enforceProtectedSession() {
                const userId = localStorage.getItem('userId');
                const role = localStorage.getItem('userRole');
                if (!userId || !role) {
                    const targetLogin = window.location.pathname.includes('/pages/') ? '../../login.html' : 'login.html';
                    window.location.replace(targetLogin);
                }
            }
            enforceProtectedSession();
            window.addEventListener('pageshow', function (event) {
                if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                    enforceProtectedSession();
                }
            });
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const uId = localStorage.getItem("userId");
            const wrapperElement = document.getElementById("bellIconWrapper");
            const dropdownElement = document.getElementById("notifDropdown");
            const badgeElement = document.getElementById("notifBadge");
            const listElement = document.getElementById("notifList");
            let dropdownOpen = false;

            if (wrapperElement && dropdownElement) {
                wrapperElement.addEventListener("click", (e) => {
                    e.stopPropagation();
                    dropdownOpen = !dropdownOpen;
                    if (dropdownOpen) {
                        dropdownElement.classList.add("active");
                        dropdownElement.style.display = "flex";
                    } else {
                        dropdownElement.classList.remove("active");
                        dropdownElement.style.display = "none";
                    }
                });

                document.addEventListener("click", () => {
                    if (dropdownOpen) {
                        dropdownOpen = false;
                        dropdownElement.classList.remove("active");
                        dropdownElement.style.display = "none";
                    }
                });
                dropdownElement.addEventListener("click", (e) => e.stopPropagation());
            }

            function fetchNotifications() {
                if (!uId) return;
                fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/user/${uId}/latest`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.unreadCount > 0) {
                            if (badgeElement) {
                                badgeElement.textContent = data.unreadCount > 9 ? '9+' : data.unreadCount;
                                badgeElement.style.display = 'flex';
                            }
                        } else {
                            if (badgeElement) badgeElement.style.display = 'none';
                        }

                        if (!data.notifications || data.notifications.length === 0) {
                            if (listElement) {
                                listElement.innerHTML = `
                  <div style="padding: 30px; text-align: center; color: #94a3b8; font-size: 14px;">
                      <i class="bi bi-inbox" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>
                      No new notifications
                  </div>`;
                            }
                        } else {
                            if (listElement) listElement.innerHTML = "";
                            data.notifications.forEach(notif => {
                                let iconHtml = '<i class="bi bi-info-circle-fill" style="color: #3b82f6; font-size: 20px;"></i>';
                                if (notif.type === 'SUCCESS') iconHtml = '<i class="bi bi-check-circle-fill" style="color: #10b981; font-size: 20px;"></i>';
                                if (notif.type === 'WARNING') iconHtml = '<i class="bi bi-exclamation-triangle-fill" style="color: #f59e0b; font-size: 20px;"></i>';
                                if (notif.type === 'ALERT') iconHtml = '<i class="bi bi-bell-fill" style="color: #ef4444; font-size: 20px;"></i>';

                                const date = new Date(notif.createdAt);
                                let secs = Math.floor((new Date() - date) / 1000);
                                if (secs < 0) secs = 0;
                                let timeStr = secs + " secs ago";
                                if (secs <= 10) timeStr = "just now";
                                else if (secs > 60 && secs < 3600) timeStr = Math.floor(secs / 60) + " mins ago";
                                else if (secs >= 3600 && secs < 86400) timeStr = Math.floor(secs / 3600) + " hours ago";
                                else if (secs >= 86400) timeStr = Math.floor(secs / 86400) + " days ago";

                                const item = document.createElement("div");
                                item.className = `notif-item ${!notif.read ? 'unread' : ''}`;
                                item.style.padding = "16px 20px";
                                item.style.borderBottom = "1px solid #f1f5f9";
                                item.style.display = "flex";
                                item.style.gap = "16px";
                                item.style.cursor = "pointer";
                                if (!notif.read) item.style.background = "#f8fafc";

                                item.innerHTML = `
                  <div style="flex-shrink: 0; margin-top: 2px;">${iconHtml}</div>
                  <div style="flex-grow: 1;">
                      <p style="margin: 0; font-size: 13px; color: #334155; line-height: 1.5; font-weight: ${!notif.read ? '700' : '500'};">
                          ${notif.message}
                      </p>
                      <span style="display: block; margin-top: 6px; font-size: 11px; color: #94a3b8;">${timeStr}</span>
                  </div>
                  ${!notif.read ? '<div class="u-dot" style="width:8px; height:8px; background:var(--primary, #0f766e); border-radius:50%; flex-shrink:0; margin-top:6px;"></div>' : ''}
                `;

                                item.addEventListener("mouseenter", () => { item.style.background = "#f1f5f9"; });
                                item.addEventListener("mouseleave", () => { item.style.background = !notif.read ? "#f8fafc" : "transparent"; });

                                item.addEventListener("click", () => {
                                    if (!notif.read) {
                                        fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/${notif.id}/read`, { method: 'PUT' })
                                            .then(() => {
                                                notif.read = true;
                                                item.classList.remove("unread");
                                                item.style.background = "transparent";
                                                const dot = item.querySelector(".u-dot");
                                                if (dot) dot.remove();

                                                if (badgeElement) {
                                                    let curr = parseInt(badgeElement.textContent);
                                                    if (!isNaN(curr) && curr > 0) {
                                                        curr--;
                                                        if (curr === 0) badgeElement.style.display = 'none';
                                                        else badgeElement.textContent = curr;
                                                    }
                                                }
                                            });
                                    }
                                });
                                if (listElement) listElement.appendChild(item);
                            });
                        }
                    })
                    .catch(console.error);
            }

            if (uId) {
                fetchNotifications();
                setInterval(fetchNotifications, 5000);
            }
        });
    </script>
    <script>
        // Header setup
        document.addEventListener("DOMContentLoaded", () => {
            const uName = localStorage.getItem("userName") || "Volunteer";
            document.getElementById("headerUserName").textContent = uName;
            if (uName) {
                document.getElementById("headerUserInitials").textContent = uName.charAt(0).toUpperCase();
            }

            const userId = localStorage.getItem("userId");
            if (userId) {
                fetch(`https://care-reach-host-production.up.railway.app/api/v1/users/${userId}/profile`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.profilePhoto) {
                            document.getElementById("headerUserImage").src = data.profilePhoto;
                            document.getElementById("headerUserImage").style.display = "block";
                            document.getElementById("headerUserInitials").style.display = "none";
                        }
                    }).catch(console.error);
            }

            // Fetch Full Notifications
            if (userId) {
                fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/user/${userId}/all`)
                    .then(res => res.json())
                    .then(data => renderFullNotifications(data))
                    .catch(console.error);
            }
        });

        function getIconProps(type) {
            switch (type) {
                case 'SUCCESS': return { cls: 'icon-success', icon: 'bi-check-circle-fill' };
                case 'WARNING': return { cls: 'icon-warning', icon: 'bi-exclamation-triangle-fill' };
                case 'ALERT': return { cls: 'icon-alert', icon: 'bi-bell-fill' };
                case 'INFO':
                default: return { cls: 'icon-info', icon: 'bi-info-circle-fill' };
            }
        }

        function timeString(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' at ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderFullNotifications(notifs) {
            const container = document.getElementById("notifications-container");

            if (!notifs || notifs.length === 0) {
                container.innerHTML = `
                <div class="loading-state">
                    <i class="bi bi-inbox" style="font-size: 48px; display: block; margin-bottom: 16px;"></i>
                    <p>No notifications history found.</p>
                </div>
            `;
                return;
            }

            container.innerHTML = "";
            container.classList.remove("loading-state");

            notifs.forEach(notif => {
                const props = getIconProps(notif.type);
                const item = document.createElement("div");
                item.className = `notif-item ${!notif.read ? 'unread' : ''}`;

                item.innerHTML = `
                <div class="notif-icon ${props.cls}">
                    <i class="bi ${props.icon}"></i>
                </div>
                <div class="notif-content">
                    <p class="notif-message" style="${!notif.read ? 'font-weight:800;' : 'font-weight:500;'}">${notif.message}</p>
                    <span class="notif-time"><i class="bi bi-clock"></i> ${timeString(notif.createdAt)}</span>
                </div>
                ${!notif.read ? '<div class="unread-dot">NEW</div>' : ''}
            `;

                if (!notif.read) {
                    item.addEventListener("click", () => {
                        fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/${notif.id}/read`, { method: 'PUT' })
                            .then(() => {
                                notif.read = true;
                                item.classList.remove("unread");
                                const dot = item.querySelector(".unread-dot");
                                if (dot) dot.remove();
                                // If widget is present, we can just let it reload on next page refresh or keep it synced loosely.
                            });
                    });
                }

                container.appendChild(item);
            });
        }
    </script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }
        
        // Auto-close sidebar when clicking outside
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(event) {
                const sidebar = document.getElementById('sidebar');
                const toggleElements = document.querySelectorAll('.mobile-toggle');
                
                if (sidebar && sidebar.classList.contains('open')) {
                    let clickedOnToggle = false;
                    toggleElements.forEach(el => {
                        if (el.contains(event.target)) clickedOnToggle = true;
                    });
                    
                    if (!sidebar.contains(event.target) && !clickedOnToggle) {
                        sidebar.classList.remove('open');
                    }
                }
            }, true); // Use capture phase to beat Chart.js stopPropagation
        });
    </script>
