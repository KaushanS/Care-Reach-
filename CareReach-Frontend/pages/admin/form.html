<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="admin-layout">
        <div class="admin-sidebar">
            <div class="logo" style="margin-bottom: 30px;">Portfolio Admin</div>
            <nav>
                <a href="/admin">Dashboard</a>
                <a href="/admin/projects">Projects</a>
                <a href="/admin/blog">Blog Posts</a>
                <a href="/admin/testimonials" class="active">Testimonials</a>
                <a href="/admin/messages">Messages</a>
                <a href="/">← Exit Admin</a>
            
<div class="menu-title" style="margin-top:auto;">Account</div>
            <a href="#" class="menu-item" onclick="logout()" style="color: #fca5a5; margin-bottom: 24px;">
                <i class="bi bi-box-arrow-left" style="color: #fca5a5;"></i> Logout
            </a>

</nav>
        </div>

        <div class="admin-main" style="max-width: 800px;">
            <div class="admin-header" style="margin-bottom: 30px;">
                <h1 th:text="${testimonial.id != null} ? 'Edit Testimonial' : 'New Testimonial'"></h1>
            </div>

            <form method="post" class="glass" style="padding: 30px; border-radius: 12px;" th:action="${testimonial.id != null} ? @{/admin/testimonials/{id}(id=${testimonial.id})} : @{/admin/testimonials}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${testimonial.name}" required>
                </div>

                <div class="mb-3">
                    <label for="position" class="form-label">Position</label>
                    <input type="text" class="form-control" id="position" name="position" th:value="${testimonial.position}">
                </div>

                <div class="mb-3">
                    <label for="company" class="form-label">Company</label>
                    <input type="text" class="form-control" id="company" name="company" th:value="${testimonial.company}" required>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">Testimonial</label>
                    <textarea class="form-control" id="content" name="content" rows="4" th:text="${testimonial.content}" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="imageUrl" class="form-label">Avatar URL</label>
                    <input type="text" class="form-control" id="imageUrl" name="imageUrl" th:value="${testimonial.imageUrl}">
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label">Rating (1-5)</label>
                    <select class="form-control" id="rating" name="rating" required>
                        <option value="1" th:selected="${testimonial.rating == 1}">⭐</option>
                        <option value="2" th:selected="${testimonial.rating == 2}">⭐⭐</option>
                        <option value="3" th:selected="${testimonial.rating == 3}">⭐⭐⭐</option>
                        <option value="4" th:selected="${testimonial.rating == 4}">⭐⭐⭐⭐</option>
                        <option value="5" th:selected="${testimonial.rating == 5}">⭐⭐⭐⭐⭐</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="displayOrder" class="form-label">Display Order</label>
                    <input type="number" class="form-control" id="displayOrder" name="displayOrder" th:value="${testimonial.displayOrder}">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Save Testimonial</button>
                    <a href="/admin/testimonials" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const adminProfile = document.querySelector('.admin-profile');
    if (adminProfile) {
        const fullName = localStorage.getItem('userFullName') || 'System Admin';
        const photo = localStorage.getItem('profilePhoto');
        const role = localStorage.getItem('userRole') || 'Administrator';

        const nameEl = adminProfile.querySelector('.admin-info h4');
        if (nameEl) nameEl.textContent = fullName;
        
        const roleEl = adminProfile.querySelector('.admin-info p');
        if (roleEl) {
            // some pages have location instead of role here, but we will put role for now, or just leave it
            // roleEl.textContent = role; // Optional, maybe we just leave the subtitle as is
        }

        const imgEl = adminProfile.querySelector('img');
        if (imgEl) {
            if (photo) {
                imgEl.src = photo;
            } else {
                const initials = fullName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                imgEl.src = 'https://ui-avatars.com/api/?name=' + initials + '&background=0f766e&color=fff';
            }
        }
    }
});
</script>




<script>
    function toggleNotifications() { } 
    document.addEventListener('click', function (event) { });

    function setupNotifications(userId) {
        let dropdownOpen = false;
        const wrapperElement = document.querySelector('.notification-wrapper');
        const dropdownElement = document.getElementById('notificationDropdown') || document.querySelector('.notification-dropdown');
        const badgeElement = document.querySelector('.notification-badge-new') || document.querySelector('.notification-badge');
        const listElement = document.querySelector('.notification-list');
        
        if (wrapperElement && dropdownElement) {
            const iconEl = wrapperElement.querySelector('.notification-icon') || wrapperElement.querySelector('.notification-icon-bell') || wrapperElement;
            iconEl.removeAttribute('onclick');
            wrapperElement.addEventListener("click", (e) => {
                e.stopPropagation();
                dropdownOpen = !dropdownOpen;
                if (dropdownOpen) dropdownElement.classList.add("show");
                else dropdownElement.classList.remove("show");
            });
            document.addEventListener("click", () => {
                if (dropdownOpen) {
                    dropdownOpen = false;
                    dropdownElement.classList.remove("show");
                }
            });
            dropdownElement.addEventListener("click", (e) => e.stopPropagation());
        }

        function fetchNotifications() {
            if (!userId) return;
            fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/user/${userId}/latest`)
                .then(res => res.json())
                .then(data => {
                    if (data.unreadCount > 0) {
                        if (badgeElement) {
                            badgeElement.textContent = data.unreadCount > 9 ? '9+' : data.unreadCount;
                            badgeElement.style.display = 'flex';
                        }
                    } else {
                        if (badgeElement) badgeElement.style.display = 'none';
                    }
                    if (!data.notifications || data.notifications.length === 0) {
                        if (listElement) listElement.innerHTML = `<div style="padding: 30px; text-align: center; color: #94a3b8; font-size: 14px;"><i class="bi bi-inbox" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>No new notifications</div>`;
                    } else {
                        if (listElement) listElement.innerHTML = "";
                        data.notifications.forEach(notif => {
                            let iconHtml = '<i class="bi bi-info-circle-fill" style="color: #3b82f6; font-size: 20px;"></i>';
                            if (notif.type === 'SUCCESS') iconHtml = '<i class="bi bi-check-circle-fill" style="color: #10b981; font-size: 20px;"></i>';
                            if (notif.type === 'WARNING') iconHtml = '<i class="bi bi-exclamation-triangle-fill" style="color: #f59e0b; font-size: 20px;"></i>';
                            if (notif.type === 'ALERT') iconHtml = '<i class="bi bi-bell-fill" style="color: #ef4444; font-size: 20px;"></i>';
                            
                            const date = new Date(notif.createdAt);
                            let secs = Math.floor((new Date() - date) / 1000);
                            if (secs < 0) secs = 0;
                            let timeStr = secs + " secs ago";
                            if (secs <= 10) timeStr = "just now";
                            else if (secs > 60 && secs < 3600) timeStr = Math.floor(secs / 60) + " mins ago";
                            else if (secs >= 3600 && secs < 86400) timeStr = Math.floor(secs / 3600) + " hours ago";
                            else if (secs >= 86400) timeStr = Math.floor(secs / 86400) + " days ago";
                            
                            const item = document.createElement("div");
                            item.className = 'notification-item ' + (!notif.read ? 'unread' : '');
                            item.style.padding = "16px";
                            item.style.borderBottom = "1px solid var(--border)";
                            item.style.display = "flex";
                            item.style.gap = "12px";
                            item.style.cursor = "pointer";
                            item.style.transition = "0.2s";
                            if (!notif.read) item.style.background = "#f8fafc";
                            
                            item.innerHTML = `
                                <div class="noti-icon" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: ${notif.type === 'SUCCESS' ? 'var(--success-bg)' : notif.type === 'WARNING' ? 'var(--warning-bg)' : notif.type === 'ALERT' ? 'var(--danger-bg)' : '#eff6ff'}; color: ${notif.type === 'SUCCESS' ? 'var(--success)' : notif.type === 'WARNING' ? 'var(--warning)' : notif.type === 'ALERT' ? 'var(--danger)' : '#3b82f6'};">${iconHtml}</div>
                                <div class="noti-content" style="flex-grow: 1;">
                                    <h4 style="font-size: 14px; margin: 0 0 4px 0; font-weight: 600; color: var(--text-dark);">${notif.type === 'SUCCESS' ? 'Success' : notif.type === 'WARNING' ? 'Security Warning' : notif.type === 'ALERT' ? 'Important Alert' : 'Information'}</h4>
                                    <p style="font-size: 13px; margin: 0 0 6px 0; color: var(--text-normal); line-height: 1.4; font-weight: ${!notif.read ? '700' : '500'};">${notif.message.replace(/^.*:\s*/i, '')}</p>
                                    <span class="noti-time" style="display: block; font-size: 11px; color: var(--text-muted); font-weight: 500;">${timeStr}</span>
                                </div>
                                ${!notif.read ? '<div class="u-dot" style="width:8px; height:8px; background:var(--primary, #0f766e); border-radius:50%; flex-shrink:0; margin-top:6px;"></div>' : ''}
                            `;
                            item.addEventListener("mouseenter", () => { item.style.background = "#f1f5f9"; });
                            item.addEventListener("mouseleave", () => { item.style.background = !notif.read ? "#f8fafc" : "transparent"; });
                            
                            item.addEventListener("click", () => {
                                if (!notif.read) {
                                    fetch(`https://care-reach-host-production.up.railway.app/api/v1/notifications/${notif.id}/read`, { method: 'PUT' })
                                        .then(() => {
                                            notif.read = true;
                                            item.classList.remove("unread");
                                            item.style.background = "transparent";
                                            const dot = item.querySelector(".u-dot");
                                            if (dot) dot.remove();
                                            if (badgeElement) {
                                                let curr = parseInt(badgeElement.textContent);
                                                if (!isNaN(curr) && curr > 0) {
                                                    curr--;
                                                    if (curr === 0) badgeElement.style.display = 'none';
                                                    else badgeElement.textContent = curr;
                                                }
                                            }
                                        });
                                }
                            });
                            
                            if (listElement) listElement.appendChild(item);
                        });
                    }
                })
                .catch(err => console.error("Notification load error:", err));
        }
        fetchNotifications();
    }
    function initNotifications() {
        const userId = localStorage.getItem('userId') || '1';
        setupNotifications(userId);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNotifications);
    } else {
        initNotifications();
    }
</script>

            document.getElementById('logoutModal').style.display = 'flex';
        }

        }
        function confirmLogout() {
            localStorage.clear();
            const targetLogin = window.location.pathname.includes('/pages/') ? '../../login.html' : 'login.html';
            window.location.replace(targetLogin);

            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }
        
        // Auto-close sidebar when clicking outside
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(event) {
                const sidebar = document.getElementById('sidebar');
                const toggleElements = document.querySelectorAll('.mobile-toggle');
                
                if (sidebar && sidebar.classList.contains('open')) {
                    let clickedOnToggle = false;
                    toggleElements.forEach(el => {
                        if (el.contains(event.target)) clickedOnToggle = true;
                    });
                    
                    if (!sidebar.contains(event.target) && !clickedOnToggle) {
                        sidebar.classList.remove('open');
                    }
                }
            }, true); // Use capture phase to beat Chart.js stopPropagation
        });
